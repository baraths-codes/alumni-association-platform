<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Web | SignUp</title>
    <link rel="stylesheet" href="../static/files/signup.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <div class="form">
            <h2>Sign Up</h2>
            <form>
                <div class="group">
                    <input type="text" required>
                    <label>Username</label>
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" class="icon" viewBox="0 0 24 24">
                        <path
                            d="M12 2a5 5 0 1 0 5 5 5 5 0 0 0-5-5zm0 8a3 3 0 1 1 3-3 3 3 0 0 1-3 3zm9 11v-1a7 7 0 0 0-7-7h-4a7 7 0 0 0-7 7v1h2v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1z">
                        </path>
                    </svg>
                </div>
                <div class="group">
                    <input type="email" required>
                    <label>E-Mail</label>
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" class="icon" viewBox="0 0 24 24">
                        <path
                            d="M20 4H4c-1.103 0-2 .897-2 2v12c0 1.103.897 2 2 2h16c1.103 0 2-.897 2-2V6c0-1.103-.897-2-2-2zm0 2v.511l-8 6.223-8-6.222V6h16zM4 18V9.044l7.386 5.745a.994.994 0 0 0 1.228 0L20 9.044 20.002 18H4z">
                        </path>
                    </svg>
                </div>
                <div class="group">
                    <input type="password" required>
                    <label>Password</label>
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" class="icon" fill="currentColor"
                        viewBox="0 0 24 24">
                        <path
                            d="M6 22h12c1.1 0 2-.9 2-2v-9c0-1.1-.9-2-2-2h-1V7c0-2.76-2.24-5-5-5S7 4.24 7 7v2H6c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2M9 7c0-1.65 1.35-3 3-3s3 1.35 3 3v2H9zm-3 4h12v9H6z">
                        </path>
                    </svg>
                </div>
                <div class="group">
                    <input type="password" required>
                    <label>Confirm Password</label>
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" class="icon" viewBox="0 0 24 24">
                        <path
                            d="M12 2C9.243 2 7 4.243 7 7v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7c0-2.757-2.243-5-5-5zM9 7c0-1.654 1.346-3 3-3s3 1.346 3 3v3H9V7zm4 10.723V20h-2v-2.277a1.993 1.993 0 0 1 .567-3.677A2.001 2.001 0 0 1 14 16a1.99 1.99 0 0 1-1 1.723z">
                        </path>
                    </svg>
                </div>
                <div class="group">
                    <select id="role" required>
                        <option value="" disabled selected></option>
                        <option value="student">Student</option>
                        <option value="alumni">Alumni</option>
                    </select>
                    <label for="role">Choose Your Role</label>
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="23" height="23" fill="currentColor"
                        viewBox="0 0 24 24">
                        <path
                            d="M4 8c0 2.28 1.72 4 4 4s4-1.72 4-4-1.72-4-4-4-4 1.72-4 4m6 0c0 1.18-.82 2-2 2s-2-.82-2-2 .82-2 2-2 2 .82 2 2M3 20h10c.55 0 1-.45 1-1v-1c0-2.76-2.24-5-5-5H7c-2.76 0-5 2.24-5 5v1c0 .55.45 1 1 1m4-5h2c1.65 0 3 1.35 3 3H4c0-1.65 1.35-3 3-3M21 11.5c0-2-1.5-3.5-3.5-3.5S14 9.5 14 11.5s1.5 3.5 3.5 3.5c.62 0 1.18-.16 1.67-.42l2.12 2.12 1.41-1.41-2.12-2.12c.26-.49.42-1.05.42-1.67M17.5 13c-.88 0-1.5-.62-1.5-1.5s.62-1.5 1.5-1.5 1.5.62 1.5 1.5-.62 1.5-1.5 1.5">
                        </path>
                    </svg>
                </div>

                <button type="button" class="btn">Create Account</button>
                <div class="link">
                    <p>Already have an account? <a href="../templates/login.html">Login Now!</a></p>
                </div>
            </form>
        </div>
        <div class="image">
            <img src="../static/files/assets/signup.png" alt="SignUp Image">
        </div>
    </div>

</body>
</html>
