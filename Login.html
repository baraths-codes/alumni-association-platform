<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Web | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
        rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: whitesmoke;
            font-family: "DM Sans", Arial;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            display: flex;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 5px 5px 20px black;
            width: 65%;
            height: 65%;
            gap: 30px;
        }

        .image {
            width: 65%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image img {
            width: 100%;
            height: auto;
        }

        .form {
            width: 40%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form h2 {
            font-size: 32px;
            margin-bottom: 25px;
            text-align: center;
        }

        .group {
            position: relative;
            margin-bottom: 22px;
        }

        .group input {
            width: 85%;
            padding: 10px 35px 10px 10px;
            font-size: 18px;
            border: none;
            border-bottom: 1.8px solid black;
            outline: none;
            transition: 0.5s;
        }

        .group input:focus,
        .group input:valid {
            border-bottom-color: darkblue;
        }

        .group label {
            position: absolute;
            left: 10px;
            top: 10px;
            font-size: 18px;
            padding: 0 5px;
            transition: 0.5s;
            pointer-events: none;
        }

        .group input:focus~label,
        .group input:valid~label {
            top: -10px;
            font-size: 14px;
            color: navy;
        }

        .icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .btn {
            padding: 10px;
            margin-left: 20%;
            margin-top: 10px;
            width: 60%;
            background: #007BFF;
            color: white;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            transition: 0.5s;
        }

        .btn:hover {
            background: #0056b4;
            cursor: pointer;
        }

        .link {
            text-align: center;
            margin-top: 25px;
        }

        .link a {
            font-size: 18px;
            color: #007BFF;
            text-decoration: none;
        }

        .link a:hover {
            text-decoration: underline;
        }

        .forgot {
            text-align: left;
            margin-bottom: 15px;
        }

        .forgot a {
            font-size: 16px;
            color: #007BFF;
            text-decoration: none;
        }

        .forgot a:hover {
            text-decoration: underline;
        }

    @media (max-width: 720px) {
        .container {
            display: flex;
            flex-direction: column;
            width: 70%;
            height: auto;
            padding: 15px;
            gap: 15px;
        }

        .image {
            width: 100%;
        }

        .image img {
            width: 100%;
            height: auto;
        }

        .form {
            width: 80%;
            padding: 0 10%;
        }

        .group input {
            width: 80%;
        }

        .btn {
            width: 100%;
            margin-left: 0;
            font-size: 15px;
            padding: 8px;
        }

        .form h2 {
            font-size: 20px;
        }

        .link p {
            font-size: 14px;
        }

        .forgot a {
            font-size: 12px;
        }
    }
    </style>
</head>

<body>
    <div class="container">
        <div class="image">
            <img src="./assets/login.jpg" alt="Login Image">
        </div>
        <div class="form">
            <h2>Login</h2>
            <form>
                <div class="group">
                    <input type="text" required>
                    <label>Username</label>
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" class="icon" viewBox="0 0 24 24">
                        <path
                            d="M12 2a5 5 0 1 0 5 5 5 5 0 0 0-5-5zm0 8a3 3 0 1 1 3-3 3 3 0 0 1-3 3zm9 11v-1a7 7 0 0 0-7-7h-4a7 7 0 0 0-7 7v1h2v-1a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v1z">
                        </path>
                    </svg>
                </div>
                <div class="group">
                    <input type="password" required>
                    <label>Password</label>
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" class="icon" viewBox="0 0 24 24">
                        <path
                            d="M12 2C9.243 2 7 4.243 7 7v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7c0-2.757-2.243-5-5-5zM9 7c0-1.654 1.346-3 3-3s3 1.346 3 3v3H9V7zm4 10.723V20h-2v-2.277a1.993 1.993 0 0 1 .567-3.677A2.001 2.001 0 0 1 14 16a1.99 1.99 0 0 1-1 1.723z">
                        </path>
                    </svg>
                </div>
                <div class="forgot">
                    <a href="#">Forgot Password?</a>
                </div>
                <button class="btn">Login</button>
                <div class="link">
                    <p>Don't Have An Account? <a href="./signUpChoose.html">SignUp Now!</a></p>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
